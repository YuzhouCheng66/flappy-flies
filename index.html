<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Race eight connectome-based flies. Full neural inference and Sheaf-GBP run on your own GPU, right in the browser."><title>Flappy Flies · Sheaf-GBP</title><link rel="stylesheet" href="./game.css"></head>
<body><canvas id="world" aria-label="Race the flies: main game, live fly brain above, second game below"></canvas>
<header><a class="wordmark" href="./">FLAPPY<span>FLIES</span><i></i></a><div class="controls"><button id="random">Random</button><input id="seed" aria-label="Map seed" type="number" min="0" max="2147483647" value="91000"><button id="run" class="primary" disabled>Run</button><button id="reset">Reset</button><button id="switch" aria-label="Switch player and flies views" aria-pressed="false">Switch ⇄</button></div><div class="live"><b></b> YOUR GPU</div></header>
<div id="score"><span id="passed">00</span><span class="divider">/</span><span id="total">04</span><small>CHECKPOINTS</small></div>
<div id="brainlabel" title="2,048 measured somata and 4,804 actual directed graph edges. Straight segments show connectivity, not reconstructed neurites. Colours show model activity, not biological recordings.">MALE CNS <span>01 / 08</span><small>165,122 neurons per agent</small></div>
<div id="status" role="status">Loading…</div>
<details id="gpu-info"><summary>GPU details</summary><pre id="gpu-details">Checking WebGPU…</pre></details>
<div id="keys"><span>W A S D / ↑ ↓ ← →</span><span>Q ↶ &nbsp; E ↷</span></div>
<div id="victory" role="dialog" aria-modal="true" aria-labelledby="winner" hidden><div class="victory-card"><div class="race-over">RACE OVER</div><h1 id="winner">YOU WIN</h1><button id="again" class="primary">Race again</button></div></div>
<button id="record" aria-label="Record live run" title="Record the live canvas · R" disabled><span></span></button>
<footer><span>8 connectome-based agents <em>×</em> Sheaf-GBP · <a href="https://github.com/yuzhoucheng66/flappy-flies#credits" target="_blank" rel="noopener">Credits &amp; source</a></span><span>LOCAL COMMUNICATION · REAL PHYSICS</span></footer>
<script src="./contracts.js"></script><script src="./race.js"></script><script type="module" src="./game.mjs"></script></body></html>
